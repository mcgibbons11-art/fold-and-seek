<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOLD &amp; SEEK — Inspector body viewer</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #08070a; overflow: hidden; }
      #body-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        margin: 0;
        padding: 8px 10px;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8dcc0;
        background: rgba(12, 10, 8, 0.62);
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="body-canvas"></canvas>
    <pre id="hud"></pre>
    <script type="module" src="./src/inspector/bodyViewer.ts"></script>
  </body>
</html>
